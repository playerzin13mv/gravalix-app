name: Compilar Gravalix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O GitHub já traz o Android SDK instalado. Este passo só aceita as licenças
      # e nunca derruba a compilação (se algo faltar, o Gradle baixa sozinho).
      - name: Preparar o Android SDK
        continue-on-error: true
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar o APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear o APK
        run: cp app/build/outputs/apk/release/app-release.apk Gravalix.apk

      - name: Guardar o APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Gravalix-apk
          path: Gravalix.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gravalix (compilação ${{ github.run_number }})
          body: |
            Baixe o arquivo **Gravalix.apk** abaixo e instale no seu Android.
            O passo a passo está no README do projeto.
          files: Gravalix.apk
          make_latest: true
