name: Compilar Gravalix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar o Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar o APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear o APK
        run: cp app/build/outputs/apk/release/app-release.apk Gravalix.apk

      - name: Guardar o APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Gravalix-apk
          path: Gravalix.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gravalix (compilação ${{ github.run_number }})
          body: |
            Baixe o arquivo **Gravalix.apk** abaixo e instale no seu Android.
            O passo a passo está no README do projeto.
          files: Gravalix.apk
          make_latest: true
